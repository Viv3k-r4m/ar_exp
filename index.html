<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Cognitive Lab</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar.js"></script>
</head>

<body>

<div id="ui">

    <h1>🧠 AR Cognitive Lab</h1>

    <p id="instruction">
        Point your camera at the AR marker.
    </p>

    <button id="startButton">
        Start Memory Test
    </button>

    <div id="testArea">

        <p id="sequence">
            Waiting for marker...
        </p>

        <input
            type="text"
            id="answer"
            placeholder="Enter sequence"
            autocomplete="off"
        >

        <button id="submitButton">
            Submit
        </button>

        <p id="result"></p>

    </div>

</div>


<!-- AR Scene -->

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam;">

    <a-marker preset="hiro">

        <!-- Main AR object -->

        <a-box
            id="cube"
            position="0 0.5 0"
            rotation="0 45 0"
            color="#4CC3D9"
            animation="property: rotation;
                       to: 0 405 0;
                       loop: true;
                       dur: 5000">
        </a-box>

        <!-- Cognitive Science label -->

        <a-text
            value="MEMORY TEST"
            position="-1 1.3 0"
            rotation="-90 0 0"
            align="center"
            color="white"
            width="4">
        </a-text>

        <!-- Floating spheres -->

        <a-sphere
            position="-0.8 0.5 0"
            radius="0.15"
            color="#EF2D5E">
        </a-sphere>

        <a-sphere
            position="0.8 0.5 0"
            radius="0.15"
            color="#FFC65D">
        </a-sphere>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script src="app.js"></script>

</body>

</html>
